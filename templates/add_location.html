<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Delivery Location</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Add Delivery Location</h1>

        <form method="POST">

            <label for="name">
                Location Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Customer A"
                required
            >

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                name="address"
                placeholder="Bole Medhanealem, Addis Ababa"
                required
            >

            <button type="submit">
                Find Location
            </button>

        </form>

        <a href="{{ url_for('home') }}"
           class="back-button">
            ← Back to Home
        </a>

    </div>

</body>

</html>
