<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Delivery Location</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="form-container">

        <h1>
            Add Delivery Location
        </h1>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('add') }}"
        >

            <label for="name">
                Customer Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Example: Customer A"
                required
            >


            <label for="address">
                Address or Place
            </label>

            <input
                type="text"
                id="address"
                name="address"
                placeholder="Example: Bole Medhanialem, Addis Ababa"
                required
            >


            <button
                type="submit"
                class="button"
            >
                Save Location
            </button>

        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-button"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
