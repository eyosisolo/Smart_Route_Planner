<!DOCTYPE html>
<html lang="en">

 <head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Location</title>

 </head>

 <body>

    <h1>Add Delivery Location</h1>

    <form method="POST">

        <label for="name">
            Location Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <br><br>

        <label for="latitude">
            Latitude
        </label>

        <input
            type="number"
            step="any"
            id="latitude"
            name="latitude"
            required
        >

        <br><br>

        <label for="longitude">
            Longitude
        </label>

        <input
            type="number"
            step="any"
            id="longitude"
            name="longitude"
            required
        >

        <br><br>

        <button type="submit">
            Save Location
        </button>

    </form>

    <br>

    <a href="{{ url_for('home') }}">
        Back to Home
    </a>

 </body>

</html>
